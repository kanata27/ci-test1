name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Setup .NET
        uses: actions/setup-dotnet@v6

        with:
          dotnet-version: "9.0.x"


      - name: Restore dependencies
        run: dotnet restore CiTest.sln

      - name: Build
        run: dotnet build CiTest.sln --configuration Release --no-restore


      - name: Test
        run: dotnet test CiTest.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/CiTest.Api/CiTest.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v7

        with: 
          name: ci-test-app
          path: ./publish
  
  docker-prep:
    runs-on: ubuntu-latest
    needs: 
      - build-test
    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v8.0.0 

        with:
          name: ci-test-app
          path: ./publish

      - name: Check app publish
        run: ls -la ./publish
        
