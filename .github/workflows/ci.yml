name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Setup .NET
        uses: actions/setup-dotnet@v6

        with:
          dotnet-version: "9.0.x"


      - name: Restore dependencies
        run: dotnet restore CiTest.sln

      - name: Build
        run: dotnet build CiTest.sln --configuration Release --no-restore


      - name: Test
        run: dotnet test CiTest.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/CiTest.Api/CiTest.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v7

        with: 
          name: ci-test-app
          path: ./publish
  
  docker:
    runs-on: ubuntu-latest
    needs: 
      - build-test
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Artifact
        uses: actions/download-artifact@v8.0.0 

        with:
          name: ci-test-app
          path: ./publish

      - name: Check app publish
        run: ls -la ./publish

      - name: Docker build
        run: docker build -t ci-test:${{ github.sha }} .

      - name: Check images
        run: docker images

      - name: Run created container
        run: docker run -d -p 8080:8080 --name ci-test-container ci-test:${{ github.sha }}

      - name: Check container
        run: |
          docker ps -a
          docker logs ci-test-container

      - name: Container healthcheck
      run: |
        for i in {1..10}; do
          if curl --fail --silent http://localhost:8080/health; then
            exit 0
          fi

          echo "Application is not ready yet..."
          sleep 2
        done

        docker logs ci-test-container
        exit 1

      - name: Remove docker container
        run: docker kill ci-test-container

      - name: Login GHCR
        uses: docker/login-action@v4

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Change tag
        run: docker tag ci-test:${{ github.sha }} ghcr.io/kanata27/ci-test1:${{ github.sha }}

      - name: Push image to GHCR
        run: docker push ghcr.io/kanata27/ci-test1:${{ github.sha }}


