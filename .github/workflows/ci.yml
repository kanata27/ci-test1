name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


permissions:
  contents: read


env:
  IMAGE_NAME: ghcr.io/kanata27/ci-test1


jobs:

  # ============================================================
  # BUILD + TEST + PUBLISH
  # ============================================================

  build-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"


      - name: Restore dependencies
        run: dotnet restore CiTest.sln


      - name: Build
        run: >
          dotnet build
          CiTest.sln
          --configuration Release
          --no-restore


      - name: Test
        run: >
          dotnet test
          CiTest.sln
          --configuration Release
          --no-build


      - name: Publish application
        run: >
          dotnet publish
          src/CiTest.Api/CiTest.Api.csproj
          --configuration Release
          --no-build
          --output ./publish


      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-app
          path: ./publish


  # ============================================================
  # DOCKER BUILD + CONTAINER TEST + GHCR PUSH
  # ============================================================

  docker:
    runs-on: ubuntu-latest

    needs:
      - build-test

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Download application artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-test-app
          path: ./publish


      - name: Build Docker image
        run: docker build -t ci-test:${{ github.sha }} .


      - name: Run container
        run: >
          docker run
          -d
          --name ci-test-container
          -p 8080:8080
          ci-test:${{ github.sha }}


      - name: Container healthcheck
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "Application is healthy"
              exit 0
            fi

            echo "Application is not ready yet..."
            sleep 2
          done

          echo "Healthcheck failed"
          docker ps -a
          docker logs ci-test-container
          exit 1


      - name: Remove test container
        if: always()
        run: docker rm -f ci-test-container || true


      - name: Tag image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          docker tag
          ci-test:${{ github.sha }}
          ${{ env.IMAGE_NAME }}:${{ github.sha }}


      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}


  # ============================================================
  # VERIFY IMAGE FROM REGISTRY
  # ============================================================

  verify-registry:
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      packages: read

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Pull image from GHCR
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}


      - name: Run image from GHCR
        run: >
          docker run
          -d
          --name ci-container
          -p 8080:8080
          ${{ env.IMAGE_NAME }}:${{ github.sha }}


      - name: Registry image healthcheck
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "Registry image is healthy"
              exit 0
            fi

            echo "Application is not ready yet..."
            sleep 2
          done

          echo "Healthcheck failed"
          docker ps -a
          docker logs ci-container
          exit 1


      - name: Remove container
        if: always()
        run: docker rm -f ci-container || true
